name: CI

on:
  create:
  push:
    branches: yolo
    paths:
      - '**.zig'
  pull_request:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check *.zig

  test-in-memory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install qemu
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y qemu-user-binfmt

      # setup-zig points ZIG_GLOBAL_CACHE_DIR/ZIG_LOCAL_CACHE_DIR at
      # $GITHUB_WORKSPACE/.zig-cache. Zig 0.16's .zip-dependency fetch
      # writes its temporary download into <cache>/tmp/ but does NOT
      # create that subdir itself, so on a fresh (cache-miss) runner the
      # fetch dies with "failed to create temporary zip file: FileNotFound".
      # Pre-create <cache>/tmp so the zip fetch has somewhere to write.
      # (Verified locally: forcing this cache dir reproduces the failure;
      # creating the tmp/ subdir makes `zig build test` succeed.)
      - name: Ensure Zig cache tmp dir exists
        shell: bash
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$GITHUB_WORKSPACE/.zig-cache}/tmp"

      - name: Run Tests in memory
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: zig build test -Dci=true -Din_memory=true --summary all -fqemu -fwine
      - name: Run Tests in memory
        if: ${{ matrix.os != 'ubuntu-24.04' }}
        run: zig build test -Dci=true -Din_memory=true --summary all
